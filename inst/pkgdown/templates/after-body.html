<script>
  // Mark the current package in the "Toolkit" menu. Matches on the package
  // name first (works for local previews), then falls back to the site URL.
  (function () {
    var pkg = "{{#package}}{{name}}{{/package}}";
    var items = document.querySelectorAll(".navbar .dropdown-menu a.dropdown-item");
    var match = null, longest = 0;
    items.forEach(function (a) {
      if (a.textContent.trim() === pkg) { match = a; longest = Infinity; }
      if (longest === Infinity) return;
      try {
        var url = new URL(a.href, location.href);
        if (url.origin === location.origin && url.pathname.length > 1 &&
            location.pathname.indexOf(url.pathname) === 0 &&
            url.pathname.length > longest) {
          match = a; longest = url.pathname.length;
        }
      } catch (e) {}
    });
    if (match) {
      match.classList.add("active", "oa-current");
      match.setAttribute("aria-current", "page");
    }
  })();
</script>
