template:
  bootstrap: 5
  light-switch: true
  theme: a11y-light
  theme-dark: a11y-dark
  bslib:
    primary: "#4169e1"
    base_font: {google: "Nunito Sans"}
    heading_font: {google: "Nunito Sans"}
    code_font: {google: "JetBrains Mono"}
    pkgdown-nav-height: 72px

navbar:
  structure:
    left:  [intro, reference, articles, casestudy, news]
    right: [packages, search, book, github, lightswitch]
  components:
    reference:
      text: Functions
      href: reference/index.html
    news:
      text: News
      href: news/index.html
    book:
      icon: fa-book
      href: https://openair-project.github.io/book/
      aria-label: The openair book
    packages:
      text: Toolkit
      menu:
      - text: Data Analysis
      - text: openair
        href: https://openair-project.github.io/openair/
      - text: openairmaps
        href: https://openair-project.github.io/openairmaps/
      - text: deweather
        href: https://openair-project.github.io/deweather/
      - text: Data Access
      - text: worldmet
        href: https://openair-project.github.io/worldmet/
      - text: euroaq
        href: https://openair-project.github.io/euroaq/
      - text: ukaq
        href: https://openair-project.github.io/ukaq/
      - text: Resources
      - text: The openair book
        href: https://openair-project.github.io/book/
      - text: openair on GitHub
        href: https://github.com/openair-project

footer:
  structure:
    left: developed_by
    right: [openair, built_with]
  components:
    openair: "Part of the [openair project](https://github.com/openair-project)."
